# Test Postgres (+ optional ClamAV) for integration tests.
# docker compose -f docker-compose.test.yml up -d
# See backend/env.test.example for DB_* variables.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: klip-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klip_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d klip_test']
      interval: 3s
      timeout: 5s
      retries: 10

  clamav-test:
    image: clamav/clamav:1.2
    container_name: klip-clamav-test
    profiles:
      - clamav
    ports:
      - '3310:3310'
