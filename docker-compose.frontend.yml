# Frontend server stack: Next.js only
# Run on frontend server (e.g. 172.28.92.56): docker-compose -f docker-compose.frontend.yml up -d
# Set NEXT_PUBLIC_API_URL in .env: use /api when Nginx proxies /api to backend (same-origin).
#
# Host port defaults to 80 (browser uses http://server/ without :3001).
# If Nginx already listens on 80 on this host, set FRONTEND_PORT=3001 and keep Nginx → 127.0.0.1:3001.
# When using port 80 without Nginx, set BACKEND_INTERNAL_URL (e.g. http://172.28.92.57:5001) so Next.js rewrites /api to the backend.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-}
        # Jetty columns on the Shipments table. Set true only where JPS is live.
        NEXT_PUBLIC_JPS_ENABLED: ${NEXT_PUBLIC_JPS_ENABLED:-false}
        # Downstream Hub SDK. Off unless URL and KEY are both set. Staging and production use
        # DIFFERENT script URLs and keys - see .env.example. GIT_SHA: pass the commit at build time.
        NEXT_PUBLIC_HUB_SDK_URL: ${NEXT_PUBLIC_HUB_SDK_URL:-}
        NEXT_PUBLIC_HUB_SDK_KEY: ${NEXT_PUBLIC_HUB_SDK_KEY:-}
        NEXT_PUBLIC_HUB_SDK_DEBUG: ${NEXT_PUBLIC_HUB_SDK_DEBUG:-false}
        NEXT_PUBLIC_GIT_SHA: ${NEXT_PUBLIC_GIT_SHA:-}
    container_name: klip-frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      # Next standalone + Docker: avoid bind/listen quirks; HOST is honored on newer Next.
      HOST: 0.0.0.0
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-80}:3001"
    networks:
      - klip-frontend-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/login',(r)=>{r.on('end',()=>process.exit(r.statusCode>=200&&r.statusCode<400?0:1));r.resume();}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  klip-frontend-network:
    driver: bridge
