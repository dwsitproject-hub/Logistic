# Optional env (create .env or export): DB_NAME, DB_USER, DB_PASSWORD, POSTGRES_PORT,
# BACKEND_PORT, FRONTEND_PORT, JWT_SECRET, NEXT_PUBLIC_API_URL (URL the browser uses for API)
# For same-origin OIDC/cookies on SIT: NEXT_PUBLIC_API_URL=/api + nginx (see docs/nginx/klip-single-origin.conf.example)
# Local cookie SSO testing: NEXT_PUBLIC_API_URL=/api BACKEND_INTERNAL_URL=http://backend:5001
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: klip-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-klip_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Schema is created by backend migrations on first backend startup
    networks:
      - klip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klip-backend
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-klip_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_POOL_MAX: ${DB_POOL_MAX:-40}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 7d
      SSO_TOKEN_SECRET: ${SSO_TOKEN_SECRET:-}
      SSO_LEGACY_BRIDGE: ${SSO_LEGACY_BRIDGE:-false}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-true}
      PRE_PLANNED_GROUPING_ENABLED: ${PRE_PLANNED_GROUPING_ENABLED:-true}
      PRE_PLANNED_WINDOW_TOL_DAYS: ${PRE_PLANNED_WINDOW_TOL_DAYS:-3}
      PRE_PLANNED_MIN_OS_MT: ${PRE_PLANNED_MIN_OS_MT:-100}
      ATTENTION_INSIGHTS_ENABLED: ${ATTENTION_INSIGHTS_ENABLED:-false}
      # Claude powers KLIP Agent AI (chat) and the AI Shipment Planner.
      # Set ANTHROPIC_API_KEY in the root .env; backend/.env is excluded by .dockerignore.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Chat agent model/effort. Defaults: claude-sonnet-5 / medium.
      ANTHROPIC_AGENT_MODEL: ${ANTHROPIC_AGENT_MODEL:-}
      ANTHROPIC_AGENT_EFFORT: ${ANTHROPIC_AGENT_EFFORT:-}
      # Shipment Planner model (defaults to claude-sonnet-4-6).
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - klip-network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:5001/api}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-}
        NEXT_PUBLIC_ATTENTION_INSIGHTS_ENABLED: ${NEXT_PUBLIC_ATTENTION_INSIGHTS_ENABLED:-false}
    container_name: klip-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:5001/api}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-}
      NEXT_PUBLIC_ATTENTION_INSIGHTS_ENABLED: ${NEXT_PUBLIC_ATTENTION_INSIGHTS_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      - backend
    networks:
      - klip-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/login',(r)=>{r.on('end',()=>process.exit(r.statusCode>=200&&r.statusCode<400?0:1));r.resume();}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local

networks:
  klip-network:
    driver: bridge

