# Optional override: bind-mount Synology share into backend /app/uploads.
# Commercial Documents year/month folders on \\172.30.1.94\APPs\dev\KLIP are PRODUCTION ONLY.
#
# Production (/opt/klip/.env):
#   KLIP_ENV=prod
#   KLIP_COMMERCIAL_DOCS_SHARE=1
#   KLIP_UPLOAD_MOUNT=/mnt/synology/dev/KLIP
#   docker compose -f docker-compose.backend.yml -f docker-compose.backend.remote-db.yml \
#     -f docker-compose.backend.synology.yml up -d --build backend
#
# SIT/local: do not attach this overlay for commercial docs. Keep Docker volume backend_uploads.

services:
  backend:
    volumes:
      - ${KLIP_UPLOAD_MOUNT:-/mnt/synology-apps/dev/klip}:/app/uploads
      - backend_logs:/app/logs
