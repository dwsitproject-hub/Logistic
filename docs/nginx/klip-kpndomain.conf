# KLIP production vhost — klip.kpndomain.com, on the frontend host 172.28.80.50
#
# Install:
#   sudo cp docs/nginx/klip-kpndomain.conf /etc/nginx/sites-available/klip.kpndomain.com.conf
#   sudo ln -s /etc/nginx/sites-available/klip.kpndomain.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t          # MUST pass - this host serves other applications on the same ports
#   sudo systemctl reload nginx
#
# Then let certbot add TLS, rather than writing it here:
#   sudo certbot --nginx -d klip.kpndomain.com
#
# Why HTTP-only in this file. The host already runs certbot for dwshub, overtime-monitoring and
# others, with automatic renewal wired to its own config edits. Hand-writing ssl_certificate paths
# would work today and then quietly diverge from what the renewal expects. `certbot --nginx` reads
# this block, adds the 443 server and the HTTP redirect itself, and stays consistent with the rest
# of the machine.
#
# Certbot cannot run until DNS resolves klip.kpndomain.com to this host: the HTTP-01 challenge is
# fetched over the domain name. Check first with:  getent hosts klip.kpndomain.com
#
# Naming follows the host's convention: sites-available/<domain>.conf, symlinked into
# sites-enabled. Added as its OWN server block - it must not touch the vhosts already there.

server {
    listen 80;
    listen [::]:80;
    server_name klip.kpndomain.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SAP and claim imports are spreadsheet uploads; the default 1m rejects the larger ones.
    client_max_body_size 64m;

    # Snapshot rebuilds and cold pages are slow by design - the trucking rebuild runs 20+ minutes
    # and a first page load after a deploy can take tens of seconds. The default 60s proxy_read
    # turns those into 504s that look like application errors.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 15s;

    # --- API -> backend host ---
    # The backend runs on a DIFFERENT machine here, unlike the staging single-origin setup.
    location /api/ {
        proxy_pass http://172.28.80.51:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OIDC SSO routes -> backend host (outside the /api prefix) ---
    # Single origin is not cosmetic: the session cookie is HttpOnly and host-bound, so the browser,
    # /api and /auth must share one hostname or SSO login cannot complete.
    location /auth/ {
        proxy_pass http://172.28.80.51:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- UI -> Next.js on this host ---
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
