# KLIP production vhost - klip.kpndomain.com, on the frontend host 172.28.80.50
#
# HTTP-only for now. HTTPS is deliberately deferred; see the note at the bottom of this file
# for why it is not a one-liner on this host.
#
# Install (run the read-only inspection FIRST - docs/scripts/prod-inspect-nginx.sh):
#   sudo cp docs/nginx/klip-kpndomain.conf /etc/nginx/sites-available/klip.kpndomain.com.conf
#   sudo ln -s /etc/nginx/sites-available/klip.kpndomain.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t          # MUST pass - this host serves other applications on the same ports
#   sudo systemctl reload nginx
#
# Why this cannot disturb the applications already on this box:
#
#  - It is its OWN server block. It adds one; it edits none.
#  - `server_name` is a single exact hostname. nginx matches server_name before anything
#    else, so requests for dwshub and the rest still land where they always did.
#  - It does NOT declare `default_server`. There is exactly one way it could still take over
#    unmatched traffic: if no existing block declares `default_server` either, nginx makes the
#    FIRST block it parses the default, and sites-enabled/* is globbed alphabetically. That is
#    what section 4 of the inspection script checks. If nothing declares default_server, give
#    this file a name that sorts AFTER the current first one (e.g. zz-klip.kpndomain.com.conf).
#  - Every directive here (client_max_body_size, the proxy timeouts, the add_headers) sits
#    INSIDE this server block, so none of it leaks into another vhost.
#  - `sudo nginx -t` is not optional. It parses the whole merged config; if it fails, do not
#    reload - the running config stays live and nothing breaks.
#
# Rollback is removing the symlink and reloading:
#   sudo rm /etc/nginx/sites-enabled/klip.kpndomain.com.conf && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name klip.kpndomain.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SAP and claim imports are spreadsheet uploads; the default 1m rejects the larger ones.
    client_max_body_size 64m;

    # Snapshot rebuilds and cold pages are slow by design - the trucking rebuild runs 20+ minutes
    # and a first page load after a deploy can take tens of seconds. The default 60s proxy_read
    # turns those into 504s that look like application errors.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 15s;

    # --- API -> backend host ---
    # The backend runs on a DIFFERENT machine here, unlike the staging single-origin setup.
    location /api/ {
        proxy_pass http://172.28.80.51:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OIDC SSO routes -> backend host (outside the /api prefix) ---
    # Single origin is not cosmetic: the session cookie is HttpOnly and host-bound, so the browser,
    # /api and /auth must share one hostname or SSO login cannot complete.
    location /auth/ {
        proxy_pass http://172.28.80.51:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- UI -> Next.js on this host ---
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- HTTPS, when we come back to it ---
#
# Not a `certbot --nginx` away, despite what the other sites on this host suggest. That uses the
# HTTP-01 challenge, which requires Let's Encrypt to connect to the host over the public internet
# - and klip.kpndomain.com points at 172.28.80.50, an RFC1918 private address that no external
# ACME server can reach. dwshub.kpndomain.com holds a genuine Let's Encrypt certificate while
# resolving to that same private address, which means its certificate came from DNS-01, not
# HTTP-01. The zone is served by Cloudflare (decker/meera.ns.cloudflare.com), so the matching
# tool is certbot's Cloudflare DNS plugin with an API token - and section 6 of the inspection
# script reports whether that is already configured on this box from the dwshub setup.
#
# Also note: as of 2026-09-15 klip.kpndomain.com resolves on the INTERNAL resolver only
# (172.30.1.5). dwshub resolves publicly too. DNS-01 does not need a public A record - only the
# _acme-challenge TXT, which the plugin creates itself - so this is not a blocker, just a
# difference worth knowing before debugging a failed issuance.
