services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:14-alpine
    container_name: klip-postgres-dev
    environment:
      POSTGRES_DB: klip_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - klip-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: klip-backend-dev
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: klip_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      # Keys are loaded from env_file (backend/.env); do not hardcode them here.
      # ANTHROPIC_API_KEY: required — KLIP Agent AI chat + AI Shipment Planner (Claude)
      # ANTHROPIC_AGENT_MODEL / ANTHROPIC_AGENT_EFFORT: optional chat-agent tuning
      # GEMINI_API_KEY: still used by the Dashboard "AI Insight" panel only
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - klip-network-dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - /app/node_modules
    command: sh -c "npm run db:migrate && npm run dev"

  # Frontend Web App (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: http://backend:5002/api
    container_name: klip-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5002/api
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - klip-network-dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules

volumes:
  postgres_data_dev:

networks:
  klip-network-dev:
    driver: bridge

