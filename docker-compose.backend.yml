# Backend server stack: PostgreSQL + Backend API
# Run on backend server (e.g. 172.28.92.57): docker compose -f docker-compose.backend.yml up -d
#
# **SIT production:** DB is on 172.28.92.60:5442 — use the remote-db overlay so the
# co-located postgres service is never started:
#   docker compose -f docker-compose.backend.yml -f docker-compose.backend.remote-db.yml up -d --build
# Set KLIP_FAIL_ON_LOCAL_DB=true in backend/.env to refuse start if DB_HOST=klip-postgres.
#
# --- Database credentials (IMPORTANT) ---
# - Docker Compose substitutes ${DB_NAME} etc. from a ".env" file in THIS DIRECTORY (/opt/klip/.env),
#   NOT from backend/.env alone. Copy or symlink:  cp backend/.env .env
# - The backend container MUST use DB_HOST=postgres and DB_PORT=5432 (Docker network to klip-postgres).
#   Values like DB_HOST=127.0.0.1 / DB_PORT=5433 in backend/.env are for running Node ON THE HOST
#   against a published Postgres port; they are overridden below so the container does not loop back
#   to itself.
# - Publish Postgres to the host (optional, for psql / ts-node on the server): POSTGRES_PORT default 5433
#
# Optional in /opt/klip/.env: DB_NAME, DB_USER, DB_PASSWORD, POSTGRES_PORT, BACKEND_PORT, JWT_SECRET
# Optional: KLIP_FAIL_ON_LOCAL_DB=true — refuse backend start when DB_HOST points at local postgres

services:
  postgres:
    image: postgres:14-alpine
    container_name: klip-postgres
    # The staging host is a small shared box (~3.4G) running containers from several
    # projects. Cap memory so a heavy query burst degrades klip only, instead of
    # taking the whole instance down (observed 2026-07-10: instance hit ~95% memory
    # and became unreachable). Normal usage observed: ~340M.
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${DB_NAME:-klip_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - klip-backend-network
    ports:
      # Host-only: tools on the server use 127.0.0.1:${POSTGRES_PORT}; backend container still uses postgres:5432
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klip-backend
    # See postgres note: cap memory on the shared staging host. Normal usage ~180M.
    mem_limit: 768m
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      # DB host: default in-stack postgres; SIT uses remote DB via /opt/klip/.env (172.28.92.60:5442)
      DB_HOST: ${DB_HOST:-klip-postgres}
      DB_PORT: ${DB_PORT:-5432}
      # DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET: from env_file (backend/.env) unless you set them in /opt/klip/.env
      JWT_EXPIRES_IN: 7d
      # Shared upload root inside container (see backend_uploads volume below; Synology optional override)
      UPLOAD_DIR: /app/uploads
      # GEMINI_API_KEY comes from env_file: ./backend/.env (do not override here or it will be empty)
      # ANTHROPIC_API_KEY does too, and is REQUIRED — it powers KLIP Agent AI (chat) and the AI
      # Shipment Planner. Without it the agent answers with a clear "not configured" error.
      # Optional in the same file: ANTHROPIC_AGENT_MODEL (default claude-sonnet-5) and
      # ANTHROPIC_AGENT_EFFORT (low|medium|high|xhigh|max, default medium).
      # Add to /opt/klip/backend/.env on the backend host; do not set them here.
      # OIDC SSO — values from /opt/klip/.env or backend/.env (must match Hub Admin registration).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SSO_LEGACY_BRIDGE: ${SSO_LEGACY_BRIDGE:-false}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-true}
      # Email / SMTP (Contract ETA reminder and future notifications) — set real values in
      # /opt/klip/.env (symlinked to backend/.env), never commit real credentials.
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-true}
      CONTRACT_ETA_REMINDER_ENABLED: ${CONTRACT_ETA_REMINDER_ENABLED:-true}
      CONTRACT_ETA_REMINDER_CRON: ${CONTRACT_ETA_REMINDER_CRON:-0 7 * * *}
      # SIT-only testing recipient(s) — added on top of the DB-driven Logistics distribution
      # list. Comma/semicolon-separated. Intentionally NOT set on local (docker-compose.yml).
      CONTRACT_ETA_REMINDER_EXTRA_RECIPIENTS: ${CONTRACT_ETA_REMINDER_EXTRA_RECIPIENTS:-ryan.pohan@energi-up.com}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - klip-backend-network
    volumes:
      # Default: local Docker volume (works when Synology is unreachable from cloud backend).
      # For Synology bind mount after network is ready, add -f docker-compose.backend.synology.yml
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  klip-backend-network:
    driver: bridge
